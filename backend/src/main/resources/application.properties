# =====================================================================
# Complaint & Ticket Management System - application.properties
# Change the values marked  <-- CHANGE  for your machine.
# =====================================================================
spring.application.name=ticket-system
server.port=8080

# ---------------- Database (MySQL) ----------------
# Create the DB first by running database/01_schema.sql and database/02_routines.sql
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=MySql@123
# <-- CHANGE username / password to your MySQL login

# Tables are created by the SQL script, so Hibernate must NOT change the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------- JWT ----------------
# Must be a Base64 string of at least 32 bytes. Use your own value in production.
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLWl0LWluLXByb2R1Y3Rpb24tMTIzNDU2}
app.jwt.expiration-minutes=60

# ---------------- OTP ----------------
app.otp.expiry-minutes=5
app.otp.max-attempts=5

# ---------------- CORS (Angular dev server) ----------------
app.cors.allowed-origins=http://localhost:4200

# ---------------- File upload ----------------
app.upload.dir=./uploads
app.upload.allowed-extensions=pdf,png,jpg,jpeg,txt,doc,docx,xls,xlsx
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------- Email ----------------
# app.mail.enabled=false  -> emails/OTPs are only PRINTED in the IntelliJ console (good for local testing)
# app.mail.enabled=true   -> real emails are sent using the SMTP settings below
app.mail.enabled=false
app.mail.from=your-email@gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-gmail-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# <-- CHANGE mail values only when app.mail.enabled=true (Gmail needs an "App Password")

# ---------------- Default users (created on first start if they do not exist) ----------------
app.seed.enabled=true
app.seed.default-password=Admin@123

# ---------------- Logging ----------------
logging.level.com.pooja.ticketsystem=INFO
